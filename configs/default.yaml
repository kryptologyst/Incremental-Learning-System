# Incremental Learning System Configuration

# Dataset configuration
dataset:
  name: "iris"  # Options: iris, wine, breast_cancer, synthetic
  test_size: 0.2
  random_state: 42
  batch_size: 15
  normalize: true

# Model configuration
model:
  algorithm: "sgd"  # Options: sgd, naive_bayes, ewc, experience_replay
  loss: "log"  # For SGD: log, hinge, modified_huber
  max_iter: 1000
  learning_rate: 0.01
  random_state: 42

# Training configuration
training:
  batch_size: 15
  evaluation_frequency: 5
  save_checkpoints: true
  checkpoint_dir: "checkpoints"

# Evaluation configuration
evaluation:
  metrics: ["accuracy", "precision", "recall", "f1"]
  compute_forgetting: true
  compute_transfer: true
  plot_curves: true

# Advanced methods configuration
advanced:
  ewc:
    lambda_reg: 1000.0
    fisher_samples: 100
  
  experience_replay:
    buffer_size: 1000
    replay_ratio: 0.3
  
  continual_learning:
    n_tasks: 3
    samples_per_task: 200
    task_overlap: 0.1

# Logging configuration
logging:
  level: "INFO"
  log_dir: "logs"
  save_plots: true
  plot_dir: "assets/plots"

# Safety and compliance
safety:
  research_only: true
  no_production_use: true
  data_privacy: true
  ethical_guidelines: true
